# Servidor estático de elsangelamelo.com. A raiz é o próprio repositório, gerado por .build/build.py.
# Fica atrás do Traefik, que termina o TLS — por isso só :80 em rede interna.
#
# Landing de página única com navegação por âncoras, sem react-router:
# NÃO há fallback para index.html. Caminho sem arquivo devolve 404 de verdade
# (evita infinitas URLs duplicadas indexáveis). Não reintroduza
# `try_files $uri /index.html`.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Sem versão no header Server nem nas páginas de erro (PRJ-000240).
    server_tokens off;
    # Location relativo nos redirects do próprio nginx (/sobre → /sobre/). O
    # nginx só ouve http na rede interna; o absoluto saía http://, rebaixando
    # o esquema atrás do Traefik (PRJ-000240).
    absolute_redirect off;

    # ─── Arquivos ocultos ─────────────────────────────────────────────────────
    # A raiz servida é o próprio repositório (.git, .gitignore, .playwright-mcp).
    # Esta precisa ser a PRIMEIRA regex: o nginx usa a primeira que casar, e a
    # de .html viria antes de um deny no fim do arquivo. /.well-known/ fica livre.
    location ~ /\.(?!well-known/) { deny all; }

    # ─── Cache ────────────────────────────────────────────────────────────────
    # HTML sempre revalidado: correção de conteúdo aparece na hora.
    location ~* \.html?$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Tudo em /assets/ é versionado (hash no nome ou ?v=): pode cachear forte.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Ícones e imagem social: nome estável, prazo médio.
    location ~* ^/(favicon\.(ico|svg|png)|apple-touch-icon\.png|og-image\.jpg)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Imagens e fontes: nome estável, prazo longo mas revalidável.
    location ~* ^/(img|images|fonts)/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Arquivos de SEO: prazo curto para o Google pegar mudanças rápido.
    location ~* ^/(sitemap\.xml|robots\.txt)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # ─── Compressão ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/xml+rss
               application/json application/javascript application/ld+json
               image/svg+xml text/javascript;

    # ─── Endereços que passaram a existir como atalho ou mudaram ───────────────
    # As páginas de tratamento continuam na raiz (/peeling/), que é a URL já
    # indexada. O formato /tratamentos/<nome>/ redireciona em vez de dar 404.
    location ~* ^/tratamentos/(harmonizacao-facial|preenchimento-labial|toxina-botulinica|bioestimuladores|skinbooster|peeling|microagulhamento|limpeza-de-pele)/?$ {
        return 301 /$1/;
    }
    location = /assets/hero-portrait-12956966.webp { return 301 /assets/img/retrato-globo-amplo-959.webp; }
    location = /assets/about-portrait-new-Bo3ebTWm.webp { return 301 /assets/img/retrato-oculos-682.webp; }
    location = /assets/elsangela-avatar.webp { return 301 /assets/img/avatar-512.webp; }

    # ─── Redirecionamentos Diretos ──────────────────────────────────────────────
    location ~* ^/(whatsapp|whats|wapp)/?$ {
        return 302 https://wa.me/5562982022330?text=Ol%C3%A1%2C%20gostaria%20de%20saber%20mais%20sobre%20os%20procedimentos%20est%C3%A9ticos!%20(Vim%20pelo%20site);
    }

    location ~* ^/(instagram|insta|ig)/?$ {
        return 302 https://www.instagram.com/elsangelamelo;
    }

    # ─── Entrega ──────────────────────────────────────────────────────────────
    # O =404 final é proposital: veja o comentário no topo. O que muda aqui é
    # só a APRESENTAÇÃO do erro — o status continua 404 de verdade, então o
    # Google segue sem indexar caminho inexistente.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Arquivos de config de outros hosts que possam sobrar no artefato.
    # (.htaccess, .htpasswd e .git: cobertos pela regra de ocultos no topo.)
    location = /_redirects { deny all; }
}
